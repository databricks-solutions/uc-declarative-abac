[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uc-declarative-abac"
version = "0.14.0"
description = "Declarative ABAC governance engine for Databricks Unity Catalog"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "databricks-sdk>=0.136.0",
]

[project.urls]
Documentation = "https://uc-declarative-abac.readthedocs.io/"
Source = "https://github.com/databricks-solutions/uc-declarative-abac"
Issues = "https://github.com/databricks-solutions/uc-declarative-abac/issues"

[project.scripts]
uc-abac = "uc_abac.cli:main"
uc-declarative-abac = "uc_abac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uc_abac", "src/abac_viewer"]
# The built UI is gitignored but must ship in the wheel.
artifacts = ["src/abac_viewer/__dist__"]
exclude = ["src/abac_viewer/ui"]

[project.optional-dependencies]
viewer = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.37.0",
]
dev = [
    "httpx2>=2.5.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "sqlglot>=20.0",
    "ruff==0.17.2",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
]

[dependency-groups]
build = [
    "hatchling",
]
# uv's default group, so a plain `uv run` (as used by apx) gets the test and viewer deps.
dev = ["uc-declarative-abac[dev,viewer]"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--cov=uc_abac --cov=abac_viewer --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.apx.metadata]
app-name = "ABAC Policy Explorer"
app-slug = "abac_viewer"
app-entrypoint = "abac_viewer.backend.app:app"
api-prefix = "/api"
metadata-path = "src/abac_viewer/_metadata.py"

[tool.apx.ui]
root = "src/abac_viewer/ui"
