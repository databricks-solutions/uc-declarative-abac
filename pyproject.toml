[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uc-declarative-abac"
version = "0.13.2"
description = "Declarative ABAC governance engine for Databricks Unity Catalog"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "databricks-sdk>=0.136.0",
]

[project.urls]
Documentation = "https://uc-declarative-abac.readthedocs.io/"
Source = "https://github.com/databricks-solutions/uc-declarative-abac"
Issues = "https://github.com/databricks-solutions/uc-declarative-abac/issues"

[project.scripts]
uc-abac = "uc_abac.cli:main"
uc-declarative-abac = "uc_abac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uc_abac"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "sqlglot>=20.0",
    "ruff==0.17.2",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
]

[dependency-groups]
build = [
    "hatchling",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--cov=uc_abac --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
