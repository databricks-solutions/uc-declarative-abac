definitions:
  tables:
    abac_viz_demo|sales|orders:
      name: orders
      comment: Order fact table, region-filtered for analysts
      tags:
        abac_demo_sensitivity: internal
        abac_demo_zone: gold
      columns:
        - name: order_id
          type: long
        - name: customer_id
          type: long
        - name: region
          type: string
          tags:
            abac_demo_filter_col: region
        - name: amount
          type: decimal(12,2)
        - name: status
          type: string
        - name: order_date
          type: date
