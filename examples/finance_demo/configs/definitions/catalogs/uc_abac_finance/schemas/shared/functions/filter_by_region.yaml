# Reusable row-filter UDF: a row is visible only to members of the matching
# regional access group. Referenced by region|filter_by_region as
# `shared.filter_by_region`. The body is rendered from the RLS mapping rule, and
# every group is validated against the account at deploy time.
definitions:
  functions:
    finance|filter_by_region:
      name: filter_by_region
      comment: Row is visible only to members of the matching regional access group.
      parameters:
        - name: region
          type: string
      match_rules:
        - name: user_in_region
          rls_mapping:
            amer: uc_abac_region_amer
            emea: uc_abac_region_emea
            apac: uc_abac_region_apac
