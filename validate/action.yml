name: Validate UC Declarative ABAC
description: >-
  Offline validation of Unity Catalog ABAC configs — parse, resolve, and
  validate the YAML without contacting Databricks (no warehouse or credentials).
author: Liam Perritt
branding:
  icon: check-circle
  color: blue

inputs:
  config-dir:
    description: Path to the YAML config directory, relative to the caller's repo root.
    required: true
  ref-override-strategy:
    description: >-
      How sibling fields on a $ref entry combine with the referenced definition.
      "merge" (default) recursively deep-merges maps and lists; "replace" shallowly
      replaces top-level keys (legacy behaviour).
    required: false
    default: 'merge'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: "0.12.17"
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/../uv.lock

    - name: Install uc-declarative-abac
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        project="${ACTION_PATH}/.."
        venv="${RUNNER_TEMP}/uc-abac-venv"
        reqs="${RUNNER_TEMP}/uc-abac-requirements.txt"
        uv export --frozen --no-dev --group build --no-emit-project --format requirements.txt \
          --output-file "${reqs}" --project "${project}"
        uv venv --python 3.13 "${venv}"
        uv pip install --python "${venv}/bin/python" --require-hashes -r "${reqs}"
        uv pip install --python "${venv}/bin/python" --no-deps --no-build-isolation "${project}"
        echo "${venv}/bin" >> "${GITHUB_PATH}"

    - name: Run uc-abac validate
      shell: bash
      env:
        CONFIG_DIR: ${{ inputs.config-dir }}
        REF_OVERRIDE_STRATEGY: ${{ inputs.ref-override-strategy }}
      run: |
        args=(
          "validate"
          --config-dir "${CONFIG_DIR}"
        )
        if [[ -n "${REF_OVERRIDE_STRATEGY}" ]]; then
          args+=(--ref-override-strategy "${REF_OVERRIDE_STRATEGY}")
        fi
        uc-abac "${args[@]}"
