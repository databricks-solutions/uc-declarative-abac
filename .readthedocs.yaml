version: 2

# Docs dependencies are installed straight from uv.lock, which verifies the locked hashes.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.12.17
      - asdf global uv 0.12.17
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-install-project --extra docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
