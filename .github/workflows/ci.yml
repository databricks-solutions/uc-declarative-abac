---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs on GitHub-hosted runners and installs from public PyPI, hash-verified against
# uv.lock. Only pushes to main write the uv cache.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --extra dev

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Format check
        run: uv run --no-sync ruff format --check src tests

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit -q

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Finance Demo example project
        uses: ./validate
        with:
          config-dir: examples/finance_demo/configs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --extra docs

      - name: Build docs
        run: uv run --no-sync sphinx-build -W --keep-going -n -b html docs docs/_build/html

      - name: Check links
        continue-on-error: true
        run: uv run --no-sync sphinx-build -b linkcheck docs docs/_build/linkcheck
