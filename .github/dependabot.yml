---
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/deploy", "/dump", "/validate"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
