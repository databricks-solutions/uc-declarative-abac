---
# No uv updates: uv.lock is locked against the internal PyPI proxy, which Dependabot cannot reach,
# so its PRs would rewrite every locked URL to public PyPI. Python dependencies are covered by
# Dependabot alerts instead, and maintainers upgrade them on VPN (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/deploy", "/dump", "/validate"]
    schedule:
      interval: monthly
    # Only propose versions that have been public for at least a month.
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns: ["*"]
