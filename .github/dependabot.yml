---
# uv updates resolve against public PyPI, keeping uv.lock free of internal Databricks index URLs
# (enforced in CI; see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/deploy", "/dump", "/validate"]
    schedule:
      interval: monthly
    # Only propose versions that have been public for at least a week.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Only propose versions that have been public for at least a week.
    # cooldown:
    #   default-days: 7
    groups:
      python:
        patterns: ["*"]
