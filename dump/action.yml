name: Dump UC Declarative ABAC
description: >-
  Snapshot the current Unity Catalog governance state behind a UC Declarative ABAC
  config into tables in a target schema.
author: Liam Perritt
branding:
  icon: database
  color: blue

inputs:
  config-dir:
    description: Path to the YAML config directory, relative to the caller's repo root.
    required: true
  warehouse-id:
    description: SQL warehouse ID the engine will use to execute UC queries.
    required: true
  target-schema:
    description: >-
      Schema to write the snapshot tables into, as <catalog>.<schema>. Created when it
      does not exist.
    required: true
  system-catalog:
    description: >-
      DEPRECATED, use use-proxy-information-schema. Catalog containing the
      information_schema views used for actual-state queries. Defaults to the
      Databricks system catalog.
    required: false
    default: system
  use-proxy-information-schema:
    description: >-
      Fully qualified <catalog>.<schema> of an existing schema holding the
      information_schema views to read actual state from, instead of
      system.information_schema. Leave empty for the default.
    required: false
    default: ''
  use-catalog-information-schema:
    description: >-
      If "true", read actual state from each managed catalog's own
      information_schema (a union across catalogs) instead of the
      system-catalog input. For proxy catalogs whose information_schema only
      describes the proxy itself.
    required: false
    default: 'false'
  timezone:
    description: >-
      IANA timezone used to compute the run date for evaluating expiry_date on
      grant policies (e.g. Australia/Melbourne). Omit (leave empty) to use UTC.
    required: false
    default: ''
  profile:
    description: >-
      Optional Databricks CLI profile name from ~/.databrickscfg. Omit (leave empty)
      to use unified auth via environment variables — e.g. DATABRICKS_HOST +
      DATABRICKS_TOKEN (PAT), DATABRICKS_CLIENT_ID + DATABRICKS_CLIENT_SECRET (OAuth M2M),
      or a metadata/managed-identity source. Set these on the step's env block.
    required: false
    default: ''
  dry-run:
    description: If "true", print the statements that would be executed without executing them.
    required: false
    default: 'false'
  replace-tables:
    description: >-
      If "true", recreate each table (CREATE OR REPLACE) before loading it, so new
      columns land in spec order rather than at the end, at the cost of a brief window
      where the table is empty. By default each table's rows are swapped in atomically.
    required: false
    default: 'false'
  max-parallel-changes:
    description: >-
      Maximum number of SQL statements run concurrently while writing tables (across
      all tables and their insert batches). Defaults to "8". Set to "1" to write
      sequentially.
    required: false
    default: '8'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.12.17"
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/../uv.lock

    - name: Install uc-declarative-abac
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        project="${ACTION_PATH}/.."
        venv="${RUNNER_TEMP}/uc-abac-venv"
        reqs="${RUNNER_TEMP}/uc-abac-requirements.txt"
        uv export --frozen --no-dev --group build --no-emit-project --format requirements.txt \
          --output-file "${reqs}" --project "${project}"
        uv venv --clear --python 3.13 "${venv}"
        uv pip install --python "${venv}/bin/python" --require-hashes -r "${reqs}"
        uv pip install --python "${venv}/bin/python" --no-deps --no-build-isolation "${project}"
        echo "${venv}/bin" >> "${GITHUB_PATH}"

    - name: Run uc-abac dump
      shell: bash
      env:
        CONFIG_DIR: ${{ inputs.config-dir }}
        WAREHOUSE_ID: ${{ inputs.warehouse-id }}
        TARGET_SCHEMA: ${{ inputs.target-schema }}
        SYSTEM_CATALOG: ${{ inputs.system-catalog }}
        USE_PROXY_INFORMATION_SCHEMA: ${{ inputs.use-proxy-information-schema }}
        USE_CATALOG_INFORMATION_SCHEMA: ${{ inputs.use-catalog-information-schema }}
        TIMEZONE: ${{ inputs.timezone }}
        PROFILE: ${{ inputs.profile }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPLACE_TABLES: ${{ inputs.replace-tables }}
        MAX_PARALLEL_CHANGES: ${{ inputs.max-parallel-changes }}
      run: |
        args=(
          "dump"
          --config-dir "${CONFIG_DIR}"
          --warehouse-id "${WAREHOUSE_ID}"
          --target-schema "${TARGET_SCHEMA}"
          --system-catalog "${SYSTEM_CATALOG}"
        )
        if [[ -n "${USE_PROXY_INFORMATION_SCHEMA}" ]]; then
          args+=(--use-proxy-information-schema "${USE_PROXY_INFORMATION_SCHEMA}")
        fi
        if [[ "${USE_CATALOG_INFORMATION_SCHEMA}" == "true" ]]; then
          args+=(--use-catalog-information-schema)
        fi
        if [[ "${DRY_RUN}" == "true" ]]; then
          args+=(--dry-run)
        fi
        if [[ "${REPLACE_TABLES}" == "true" ]]; then
          args+=(--replace-tables)
        fi
        if [[ -n "${TIMEZONE}" ]]; then
          args+=(--timezone "${TIMEZONE}")
        fi
        if [[ -n "${PROFILE}" ]]; then
          args+=(--profile "${PROFILE}")
        fi
        args+=(--max-parallel-changes "${MAX_PARALLEL_CHANGES}")
        uc-abac "${args[@]}"
