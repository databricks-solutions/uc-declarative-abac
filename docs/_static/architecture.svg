<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">UC Declarative ABAC architecture</title>
  <desc id="desc">The uc-abac CLI and GitHub Actions run the engine. The engine loads and resolves the YAML configs, compiles the desired state, fetches the actual state from Unity Catalog, diffs the two with principal resolution, and executes the changes. The dump command writes the actual state, attributed to config files, to tables in a target schema, which the ABAC Policy Explorer reads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b3139"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5a6b72"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: 600; fill: #1b3139; }
      .sub { font-size: 11px; fill: #4a5a61; }
      .code { font-size: 11px; fill: #4a5a61; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 11px; fill: #1b3139; }
      .step { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .group { font-size: 13px; font-weight: 700; fill: #1b3139; }
      .box { fill: #ffffff; stroke: #1b3139; stroke-width: 1.5; }
      .ext { fill: #eef2f3; stroke: #1b3139; stroke-width: 1.5; }
      .flow { fill: none; stroke: #1b3139; stroke-width: 1.6; }
      .link { fill: none; stroke: #5a6b72; stroke-width: 1.4; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- Inputs and entry points -->
  <text class="group" x="20" y="26">Inputs and entry points</text>

  <rect class="ext" x="20" y="44" width="180" height="76" rx="8"/>
  <text class="title" x="110" y="72" text-anchor="middle">YAML configs</text>
  <text class="code" x="110" y="91" text-anchor="middle">definitions:</text>
  <text class="code" x="110" y="106" text-anchor="middle">resources:</text>

  <rect class="ext" x="20" y="206" width="180" height="70" rx="8"/>
  <text class="title" x="110" y="232" text-anchor="middle">uc-abac CLI</text>
  <text class="code" x="110" y="252" text-anchor="middle">cli/</text>

  <rect class="ext" x="20" y="300" width="180" height="70" rx="8"/>
  <text class="title" x="110" y="326" text-anchor="middle">GitHub Actions</text>
  <text class="code" x="110" y="346" text-anchor="middle">validate/ deploy/ dump/</text>

  <text class="title" x="20" y="414">Commands</text>
  <text class="label" x="20" y="436"><tspan font-weight="700">validate</tspan>: step 1</text>
  <text class="label" x="20" y="456"><tspan font-weight="700">deploy</tspan>: steps 1 to 5</text>
  <text class="label" x="20" y="476"><tspan font-weight="700">deploy --dry-run</tspan>: 1 to 5, logs only</text>
  <text class="label" x="20" y="496"><tspan font-weight="700">dump</tspan>: steps 1, 3 and 6</text>

  <!-- Engine boundary -->
  <rect x="230" y="40" width="560" height="530" rx="12" fill="#fff6f5" stroke="#ff3621" stroke-width="2"/>
  <text class="group" x="250" y="64">uc_abac engine</text>
  <text class="code" x="372" y="64">src/uc_abac (orchestrator.py)</text>

  <!-- 1 config pipeline -->
  <rect class="box" x="250" y="80" width="520" height="70" rx="6"/>
  <text class="title" x="510" y="104" text-anchor="middle">Config pipeline</text>
  <text class="code" x="510" y="122" text-anchor="middle">configs/: discovery, resolver ($ref, $vars), consolidator, models</text>
  <text class="sub" x="510" y="139" text-anchor="middle">one validated ResourcesConfig, every entry stamped with its file</text>
  <circle cx="250" cy="80" r="9" fill="#ff3621"/><text class="step" x="250" y="84" text-anchor="middle">1</text>

  <!-- 2 compilers / 3 fetch -->
  <rect class="box" x="250" y="190" width="240" height="80" rx="6"/>
  <text class="title" x="370" y="214" text-anchor="middle">Compilers</text>
  <text class="code" x="370" y="233" text-anchor="middle">&lt;domain&gt;/compiler.py</text>
  <text class="sub" x="370" y="252" text-anchor="middle">desired state, principals by name</text>
  <circle cx="250" cy="190" r="9" fill="#ff3621"/><text class="step" x="250" y="194" text-anchor="middle">2</text>

  <rect class="box" x="520" y="190" width="240" height="80" rx="6"/>
  <text class="title" x="640" y="214" text-anchor="middle">Actual state fetch</text>
  <text class="code" x="640" y="233" text-anchor="middle">helpers/ (UC, workspace)</text>
  <text class="sub" x="640" y="252" text-anchor="middle">fetched in parallel, by identifier</text>
  <circle cx="520" cy="190" r="9" fill="#ff3621"/><text class="step" x="520" y="194" text-anchor="middle">3</text>

  <!-- 4 differs / 6 dumper -->
  <rect class="box" x="250" y="310" width="240" height="80" rx="6"/>
  <text class="title" x="370" y="334" text-anchor="middle">Differs</text>
  <text class="code" x="370" y="353" text-anchor="middle">&lt;domain&gt;/differ.py</text>
  <text class="sub" x="370" y="372" text-anchor="middle">resolve principals, then diff</text>
  <circle cx="250" cy="310" r="9" fill="#ff3621"/><text class="step" x="250" y="314" text-anchor="middle">4</text>

  <rect class="box" x="520" y="310" width="240" height="80" rx="6"/>
  <text class="title" x="640" y="334" text-anchor="middle">Dumper</text>
  <text class="code" x="640" y="353" text-anchor="middle">dumper/</text>
  <text class="sub" x="640" y="372" text-anchor="middle">state rows, attributed to config files</text>
  <circle cx="520" cy="310" r="9" fill="#ff3621"/><text class="step" x="520" y="314" text-anchor="middle">6</text>

  <!-- 5 executors -->
  <rect class="box" x="250" y="430" width="240" height="80" rx="6"/>
  <text class="title" x="370" y="454" text-anchor="middle">Executors</text>
  <text class="code" x="370" y="473" text-anchor="middle">&lt;domain&gt;/executor.py</text>
  <text class="sub" x="370" y="492" text-anchor="middle">SQL and SDK calls, within scopes</text>
  <circle cx="250" cy="430" r="9" fill="#ff3621"/><text class="step" x="250" y="434" text-anchor="middle">5</text>

  <text class="sub" x="250" y="530">Domains: governed tags, tags, securables, privileges,</text>
  <text class="sub" x="250" y="545">policies, groups, domains. Each has a compiler, a differ</text>
  <text class="sub" x="250" y="560">and an executor; principals/resolver.py resolves names.</text>

  <!-- Unity Catalog -->
  <rect class="ext" x="820" y="190" width="160" height="320" rx="8"/>
  <text class="title" x="900" y="222" text-anchor="middle">Unity Catalog</text>
  <text class="sub" x="900" y="242" text-anchor="middle">and the workspace</text>
  <text class="sub" x="900" y="276" text-anchor="middle">catalogs, schemas, tables</text>
  <text class="sub" x="900" y="294" text-anchor="middle">governed tags, tags</text>
  <text class="sub" x="900" y="312" text-anchor="middle">grants</text>
  <text class="sub" x="900" y="330" text-anchor="middle">ABAC policies</text>
  <text class="sub" x="900" y="348" text-anchor="middle">groups, domains</text>
  <text class="sub" x="900" y="382" text-anchor="middle">read via system tables,</text>
  <text class="sub" x="900" y="398" text-anchor="middle">SQL and SDK list APIs</text>

  <!-- Flows: inputs -->
  <path class="flow" d="M200 82 H246" marker-end="url(#arrow)"/>
  <path class="flow" d="M200 241 H215 V115 H246" marker-end="url(#arrow)"/>
  <path class="flow" d="M200 335 H215 V241"/>
  <text class="label" x="207" y="186" transform="rotate(-90 207 186)" text-anchor="middle">runs</text>

  <!-- Flows: engine -->
  <path class="flow" d="M370 150 V186" marker-end="url(#arrow)"/>
  <text class="label" x="378" y="173">config</text>
  <path class="flow" d="M370 270 V306" marker-end="url(#arrow)"/>
  <text class="label" x="378" y="293">desired</text>
  <path class="flow" d="M520 250 L494 318" marker-end="url(#arrow)"/>
  <text class="label" x="499" y="286" text-anchor="end">actual</text>
  <path class="flow" d="M640 270 V306" marker-end="url(#arrow)"/>
  <text class="label" x="648" y="293">actual</text>
  <path class="flow" d="M770 115 H780 V350 H764" marker-end="url(#arrow)"/>
  <text class="label" x="776" y="170" transform="rotate(90 776 170)" text-anchor="middle">config</text>
  <path class="flow" d="M370 390 V426" marker-end="url(#arrow)"/>
  <text class="label" x="378" y="413">diffs</text>

  <!-- Flows: Unity Catalog -->
  <path class="flow" d="M820 230 H764" marker-end="url(#arrow)"/>
  <text class="label" x="800" y="248" text-anchor="middle">read</text>
  <path class="flow" d="M490 470 H816" marker-end="url(#arrow)"/>
  <text class="label" x="653" y="462" text-anchor="middle">apply changes</text>

  <!-- Dump tables and the explorer -->
  <rect class="ext" x="520" y="610" width="240" height="70" rx="8"/>
  <text class="title" x="640" y="637" text-anchor="middle">Dump tables</text>
  <text class="sub" x="640" y="656" text-anchor="middle">target schema, via a SQL warehouse</text>
  <path class="flow" d="M640 390 V606" marker-end="url(#arrow)"/>
  <text class="label" x="648" y="595">write</text>

  <rect x="230" y="610" width="260" height="70" rx="8" fill="#f4f6f7" stroke="#1b3139" stroke-width="1.5"/>
  <text class="title" x="360" y="637" text-anchor="middle">ABAC Policy Explorer</text>
  <text class="code" x="360" y="656" text-anchor="middle">src/abac_viewer (Databricks App)</text>
  <path class="flow" d="M520 645 H494" marker-end="url(#arrow)"/>
  <text class="label" x="507" y="637" text-anchor="middle">read</text>
  <path class="link" d="M300 570 V606" marker-end="url(#arrow-muted)"/>
  <text class="label" x="308" y="594">imports uc_abac.types (privilege maps)</text>

  <!-- Legend -->
  <path class="flow" d="M20 728 H60" marker-end="url(#arrow)"/>
  <text class="label" x="68" y="732">data flow</text>
  <path class="link" d="M150 728 H190" marker-end="url(#arrow-muted)"/>
  <text class="label" x="198" y="732">code dependency</text>
  <rect x="320" y="720" width="16" height="16" rx="3" class="ext"/>
  <text class="label" x="344" y="732">outside the engine</text>
  <rect x="470" y="720" width="16" height="16" rx="3" fill="#fff6f5" stroke="#ff3621" stroke-width="2"/>
  <text class="label" x="494" y="732">the uc_abac package</text>
  <rect x="640" y="720" width="16" height="16" rx="3" fill="#f4f6f7" stroke="#1b3139" stroke-width="1.5"/>
  <text class="label" x="664" y="732">the abac_viewer package</text>
</svg>
